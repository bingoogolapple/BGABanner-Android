apply plugin: 'com.android.application'

android {
    namespace = 'cn.bingoogolapple.bgabanner.demo'
    compileSdk = ANDROID_BUILD_SDK_VERSION as int

    defaultConfig {
        minSdk = ANDROID_BUILD_MIN_SDK_VERSION as int
        targetSdk = ANDROID_BUILD_TARGET_SDK_VERSION as int
        versionCode VERSION_CODE as int
        versionName VERSION_NAME
    }

    buildTypes {
        release {
            // 本地测试用：复用 SDK 自动生成的 debug 签名，避免产出未签名 APK。正式发布到应用市场时，请改为自有 release 密钥（不要提交密码到仓库）。
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
//    implementation "cn.bingoogolapple:bga-banner:${VERSION_NAME}@aar"
    implementation project(':library')

    // 以下几个库是演示案例所使用到的
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'cn.bingoogolapple:bga-baseadapter:3.0.0@aar'

    implementation 'com.facebook.fresco:fresco:3.7.0'
}
